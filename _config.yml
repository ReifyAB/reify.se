title: Reify AB
tagline: Value-Oriented Programming
description: >-
  Jean-Louis Giordano: freelance CTO, principal engineer and consultant
  in distributed systems, cloud platforms and technical leadership.
url: https://reify.se
lang: en

author:
  name: Jean-Louis Giordano
  title: Value-Oriented Programmer
  email: jean-louis@reify.se
  github: Jell
  linkedin: jeanlouisgiordano
  picture: /assets/images/profile_bw.png

company:
  name: Reify AB
  org_number: 559237-4812

# Keep existing post URLs, e.g. /blog/2016-10-25-euroclojure
permalink: /blog/:year-:month-:day-:title
excerpt_separator: "<!-- more -->"

# github-pages otherwise adds the Primer theme, whose CSS and layouts clash with ours
theme: null

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: atom.xml

# Used by jekyll-seo-tag
social:
  name: Jean-Louis Giordano
  links:
    - https://github.com/Jell
    - https://www.linkedin.com/in/jeanlouisgiordano/
logo: /favicon.png

defaults:
  - scope: { path: "" }
    values: { layout: page }
  - scope: { path: "", type: posts }
    values: { layout: post }

exclude:
  - README.md
  - Rakefile
  - Gemfile
  - Gemfile.lock
  - vendor
  - CNAME
