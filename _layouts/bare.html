<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    {% seo %}
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/reify-mark.svg' | relative_url }}">
    <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>

  <body>
    {% comment %}
    The site's colours and type, without the header, sidebar and footer.
    For standalone pages like an app's privacy policy.
    {% endcomment %}
    <div class="layout layout--wide">
      <main class="main" id="content">
        <article class="page">
          <header class="page-header">
            <h1>{{ page.title }}</h1>
            {% if page.tagline %}<p class="tagline">{{ page.tagline }}</p>{% endif %}
          </header>

          <div class="prose">
            {{ content }}
          </div>
        </article>
      </main>
    </div>
  </body>
</html>
