<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    {% seo %}
    {% feed_meta %}
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }} (RSS)" href="{{ '/rss.xml' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/reify-mark.svg' | relative_url }}">
    <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>

  <body>
    {% include header.html %}

    <div class="layout{% if page.sidebar == false %} layout--wide{% endif %}">
      <main class="main" id="content">
        {{ content }}
      </main>

      {% unless page.sidebar == false %}
      <aside class="sidebar">
        {% include profile.html %}
      </aside>
      {% endunless %}
    </div>

    {% include footer.html %}
  </body>
</html>
